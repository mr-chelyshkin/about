name: Manual

on: workflow_dispatch

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  static-ci:
    name: static ci
    uses: mr-chelyshkin/actions/.github/workflows/static-site-ci.yml@v1

  terraform-ci:
    name: terraform ci
    uses: mr-chelyshkin/actions/.github/workflows/terraform-ci.yml@v1
