<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Igor Chelyshkin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --color-background-main: #f7f7f2;
        --color-background-contrast: #171717;
        --color-text-main: #171717;
        --color-text-contrast: #f7f7f2;
        --color-text-secondary: #595954;
        --color-accent: #bbc3c4;
        --font-mono: 'Roboto Mono', 'SFMono-Regular', Consolas, monospace;
        --motion-fast: 160ms;
      }

      body {
        margin: 0;
        font-family: var(--font-mono);
        background: var(--color-background-main);
        color: var(--color-text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 600px;
        padding: 2rem;
      }

      .not-found-code {
        font-size: 8rem;
        font-weight: 700;
        color: var(--color-text-main);
        font-family: var(--font-mono);
        margin: 0 0 1rem;
      }

      .not-found-error {
        font-size: 2rem;
        font-weight: 600;
        color: var(--color-text-main);
        margin-bottom: 2rem;
        animation: glitch 0.6s infinite;
      }

      .not-found-message {
        color: var(--color-text-secondary);
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 3rem;
      }

      .not-found-actions {
        display: flex;
        gap: 2rem;
        justify-content: center;
        align-items: center;
      }

      .not-found-button {
        background: var(--color-background-contrast);
        color: var(--color-text-contrast);
        border: 2px solid var(--color-text-main);
        padding: 1rem 2rem;
        font-family: var(--font-mono);
        font-weight: 600;
        cursor: pointer;
        transition:
          background-color var(--motion-fast),
          color var(--motion-fast);
        position: relative;
        text-decoration: none;
        display: inline-block;
      }

      .not-found-button::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        width: 15px;
        height: 15px;
        background: var(--color-background-contrast);
        transition:
          background-color var(--motion-fast),
          width var(--motion-fast),
          height var(--motion-fast);
      }

      .not-found-button:hover {
        background: transparent;
        color: var(--color-text-main);
      }

      .not-found-button:hover::before {
        background: var(--color-accent);
        width: 20px;
        height: 20px;
      }

      .not-found-link {
        color: var(--color-text-main);
        font-family: var(--font-mono);
        text-decoration: none;
        position: relative;
        font-weight: 600;
        font-size: 1rem;
      }

      .not-found-link::after {
        background: currentColor;
        transform-origin: left;
        position: absolute;
        content: '';
        top: 50%;
        left: -0.5rem;
        height: max(1px, 0.025em);
        right: -0.5rem;
        transform: translateY(-50%) scaleX(0);
        transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .not-found-link:hover::after {
        transform: translateY(-50%) scaleX(1);
      }

      a:focus-visible {
        outline: 2px solid var(--color-text-main);
        outline-offset: 4px;
      }

      @keyframes glitch {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-2px) skew(2deg);
        }
        40% {
          transform: translateX(2px) skew(-2deg);
        }
        60% {
          transform: translateX(-1px) skew(1deg);
        }
        80% {
          transform: translateX(1px) skew(-1deg);
        }
      }

      @media (max-width: 768px) {
        .not-found-code {
          font-size: 6rem;
        }
        .not-found-error {
          font-size: 1.5rem;
        }
        .not-found-actions {
          flex-direction: column;
          gap: 1rem;
        }
      }

      @media (max-width: 419px) {
        .not-found-code {
          font-size: 4rem;
        }
        .container {
          padding: 1rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .not-found-error {
          animation: none;
        }
        .not-found-button,
        .not-found-button::before,
        .not-found-link::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1 class="not-found-code">404</h1>
      <div class="not-found-error">ERROR</div>
      <p class="not-found-message">
        The requested resource could not be located on this server.<br />
        Perhaps you were looking for something else?
      </p>
      <div class="not-found-actions">
        <a href="/" class="not-found-button">Return to Home</a>
        <a href="https://github.com/mr-chelyshkin" target="_blank" class="not-found-link">
          Check GitHub
        </a>
      </div>
    </main>
  </body>
</html>
