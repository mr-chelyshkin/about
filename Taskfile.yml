# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  terraform:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.1/taskfiles/terraform/Taskfile.yml
    vars:
      TERRAFORM_VERSION: '1.15.9'
      CONTAINER_ENVS: >-
        AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
        TF_VAR_aws_region TF_VAR_domain_name TF_VAR_site_bucket_name TF_VAR_acm_certificate_arn
  node:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.1/taskfiles/node/Taskfile.yml
    vars:
      NODE_VERSION: '22.23.1'
  aws:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.1/taskfiles/aws/Taskfile.yml
    vars:
      AWS_VERSION: '2.36.24'

tasks:
  run/dev:
    desc: "Run dev environment"
    cmds:
      - task: node:_npm/tool
        vars:
          CMD: "sh -c 'npm install && npm run optimize-images && exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5173'"

  ci/build:
    desc: "Run build static"
    cmds:
      - task: node:_npm/tool
        vars:
          CMD: "sh -c 'npm ci && npm run optimize-images && npm run type-check && npm run build'"

  ci/test:
    desc: "Run application checks"
    cmds:
      - task: node:run
        vars:
          SCRIPT: type-check

  ci/audit:
    desc: "Run dependencies audit"
    cmds:
      - task: node:audit

  ci/terraform-fmt:
    desc: "Run terraform fmt check"
    cmds:
      - task: terraform:fmt

  ci/terraform-validate:
    desc: "Run terraform validation"
    cmds:
      - task: terraform:validate

  cd/terraform-apply:
    requires:
      vars: [ TF_BACKEND_BUCKET, TF_BACKEND_KEY, TF_BACKEND_REGION ]
    cmds:
      - task: terraform:apply
        vars:
          INIT_ARGS: >-
            -input=false -reconfigure -lockfile=readonly
            -backend-config={{printf "bucket=%s" .TF_BACKEND_BUCKET | shellQuote}}
            -backend-config={{printf "region=%s" .TF_BACKEND_REGION | shellQuote}}
            -backend-config={{printf "key=%s" .TF_BACKEND_KEY | shellQuote}}
            -backend-config=encrypt=true
            -backend-config=use_lockfile=true

  cd/deploy:
    requires:
      vars: [ SITE_BUCKET_NAME, CLOUDFRONT_DISTRIBUTION_ID ]
    cmds:
      - task: aws:s3/upload/static
        vars:
          SOURCE_DIR: app/dist
          BUCKET: '{{.SITE_BUCKET_NAME}}'
          IMMUTABLE_PATTERNS: '*'
      - task: aws:cloudfront/cache/invalidate
        vars:
          DISTRIBUTION_ID: '{{.CLOUDFRONT_DISTRIBUTION_ID}}'
